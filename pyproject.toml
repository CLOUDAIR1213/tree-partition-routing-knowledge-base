[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "txtai-partitioned-knowledge-base"
version = "0.1.0"
description = "Three-partition knowledge base MVP"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "aiosqlite==0.21.0",
  "fastapi==0.141.1",
  "httpx==0.28.1",
  "pydantic==2.12.5",
  "pydantic-settings==2.12.0",
  "pypdf==6.1.3",
  "python-docx==1.2.0",
  "python-multipart==0.0.20",
  "sqlalchemy==2.0.43",
  "structlog==25.4.0",
  "txtai==9.13.0",
  "uvicorn[standard]==0.35.0",
]

[dependency-groups]
dev = [
  "pytest==8.4.2",
  "pytest-asyncio==1.1.0",
  "reportlab==4.4.3",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
# This is an application, not an installed library. Avoid an editable .pth file:
# Python 3.11 on Chinese Windows paths can decode that UTF-8 file as GBK.
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
